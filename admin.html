<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Dream Decors</title>
<style>body{font-family:Arial;padding:15px;background:#fff5f7}input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{background:#88002a;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-size:16px}.box{background:white;padding:15px;border-radius:12px;margin-top:10px;word-break:break-all;font-size:12px}</style>
</head><body>
<h2>Dream Decors - Add New Event</h2>
<p style="font-size:12px;color:gray">For Yeswanth - Fill and copy code to data.js</p>
<input id="title" placeholder="Event Title Ex: Wedding at Palace">
<select id="cat"><option>Wedding</option><option>Birthday</option><option>Corporate</option><option>DJ</option><option>Decoration</option></select>
<input id="date" type="date">
<textarea id="img" placeholder="Paste Image Link after uploading to GitHub /images"></textarea>
<button onclick="gen()">Generate Code</button>
<div class="box" id="out">Code will appear here...</div>
<script>
function gen(){
 const t=document.getElementById('title').value;
 const c=document.getElementById('cat').value;
 const d=document.getElementById('date').value;
 const i=document.getElementById('img').value;
 const code=`  {\n    title: "${t}",\n    category: "${c}",\n    date: "${d}",\n    image: "${i}"\n  },`;
 document.getElementById('out').innerText=code;
}
</script>
</body></html>
